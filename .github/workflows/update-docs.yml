# Reference GitHub Actions workflow for updating CatchAll API docs.
# Copy this to .github/workflows/update-docs.yml in the docs repo.
#
# AGENT.md and LESSONS.md are pulled from a GitLab repository (ai-configs)
# using the GitLab Files API and a personal access token.
#
# The new OpenAPI spec (fastapi-openapi.yml) is expected to already be
# committed to the docs repo — the mirror-fastapi-oas.yml workflow does this.
# Run that workflow first, then trigger this one.
#
# Flow:
#   1. mirror-fastapi-oas.yml  →  commits new fastapi-openapi.yml
#   2. this workflow           →  diffs specs, updates docs, opens PR

name: Update CatchAll API Docs

on:
  workflow_dispatch:
    inputs:
      notion_url:
        description: "Notion changelog URL (e.g. https://app.notion.com/p/newscatcherapi/1-6-2-...)"
        required: true
        type: string
      release_version:
        description: "New API version (e.g. 1.6.2)"
        required: true
        type: string
      release_date:
        description: "Release date (YYYY-MM-DD)"
        required: true
        type: string
      new_spec_path:
        description: "Path to new OpenAPI spec in repo (relative to repo root)"
        required: false
        default: "web-search-api/api-reference/fastapi-openapi.yml"
        type: string
      target_branch:
        description: "Existing branch to commit docs changes onto (from mirror-fastapi-oas run). Leave empty to create a new branch."
        required: false
        default: ""
        type: string

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
      GITLAB_BRANCH: "main"
      GITLAB_BASE: "https://gitlab.com/api/v4/projects"

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git identity
        run: |
          git config user.name "docs-update-bot"
          git config user.email "bot@newscatcherapi.com"

      # Fetch AGENT.md and LESSONS.md from GitLab using the Files API.
      # GITLAB_PAT must be a GitLab personal access token with read_repository scope.
      - name: Fetch AGENT.md and LESSONS.md from GitLab
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          mkdir -p /tmp/agents/update-mintify-docs-when-api-release

          FILES=(
            "agents%2Fupdate-mintify-docs-when-api-release%2FAGENT.md:/tmp/agents/update-mintify-docs-when-api-release/AGENT.md"
            "agents%2Fupdate-mintify-docs-when-api-release%2FLESSONS.md:/tmp/agents/update-mintify-docs-when-api-release/LESSONS.md"
          )

          for entry in "${FILES[@]}"; do
            ENCODED_PATH="${entry%%:*}"
            LOCAL_PATH="${entry##*:}"
            URL="${GITLAB_BASE}/${GITLAB_PROJECT}/repository/files/${ENCODED_PATH}/raw?ref=${GITLAB_BRANCH}"

            echo "Fetching ${ENCODED_PATH}..."
            curl -sf -H "PRIVATE-TOKEN: $GITLAB_PAT" "$URL" -o "$LOCAL_PATH"
          done

          echo "--- AGENT.md preview (first 5 lines) ---"
          head -5 /tmp/agents/update-mintify-docs-when-api-release/AGENT.md

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run docs update agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_URL: ${{ inputs.notion_url }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          NEW_SPEC_PATH: ${{ inputs.new_spec_path }}
          TARGET_SPEC_PATH: "web-search-api/api-reference/catch-all-api.yml"
          TARGET_BRANCH: ${{ inputs.target_branch }}
          DOCS_REPO_PATH: ${{ github.workspace }}
          LESSONS_PATH: "/tmp/agents/update-mintify-docs-when-api-release/LESSONS.md"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT="Read and execute the agent instructions at /tmp/agents/update-mintify-docs-when-api-release/AGENT.md. All required environment variables are already set. Working directory is the docs repo root: $DOCS_REPO_PATH"

          echo "$PROMPT" | claude \
            --print \
            --dangerously-skip-permissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      # If the agent updated LESSONS.md, open a GitLab merge request with the change.
      # We never commit straight to GitLab main — it is a protected branch, so a
      # direct Files API PUT is rejected. Instead: branch off main, commit there,
      # open an MR, and let a human review and merge it.
      - name: Open GitLab MR with updated LESSONS.md
        if: always()
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          LESSONS="/tmp/agents/update-mintify-docs-when-api-release/LESSONS.md"
          ORIGINAL="${LESSONS}.original"
          FILE_PATH="agents%2Fupdate-mintify-docs-when-api-release%2FLESSONS.md"
          PROJECT_API="${GITLAB_BASE}/${GITLAB_PROJECT}"

          if [ ! -f "$LESSONS" ]; then
            echo "LESSONS.md not present locally — the agent step never got that far. Nothing to push."
            exit 0
          fi

          # api <METHOD> <URL> [JSON_BODY]
          # Prints the response body, sets RESPONSE_BODY, returns non-zero on HTTP >= 400.
          # Deliberately no curl -f, so GitLab's error message is visible in the log.
          api() {
            local method="$1" url="$2" body="${3:-}" raw http
            if [ -n "$body" ]; then
              raw=$(curl -sS -X "$method" -w $'\n%{http_code}' \
                -H "PRIVATE-TOKEN: $GITLAB_PAT" \
                -H "Content-Type: application/json" \
                --data "$body" "$url")
            else
              raw=$(curl -sS -X "$method" -w $'\n%{http_code}' \
                -H "PRIVATE-TOKEN: $GITLAB_PAT" "$url")
            fi
            http=$(printf '%s' "$raw" | tail -n1)
            RESPONSE_BODY=$(printf '%s' "$raw" | sed '$d')
            echo "HTTP ${http}: ${RESPONSE_BODY}"
            [ "$http" -lt 400 ]
          }

          # Compare against the current state of GitLab main.
          curl -sS -H "PRIVATE-TOKEN: $GITLAB_PAT" \
            "${PROJECT_API}/repository/files/${FILE_PATH}/raw?ref=${GITLAB_BRANCH}" \
            -o "$ORIGINAL"

          if diff -q "$ORIGINAL" "$LESSONS" > /dev/null 2>&1; then
            echo "LESSONS.md unchanged — nothing to push"
            exit 0
          fi

          BRANCH="docs-agent/lessons-v${RELEASE_VERSION}-${RUN_ID}"
          echo "LESSONS.md was updated — opening MR from ${BRANCH} into ${GITLAB_BRANCH}"

          if ! api POST "${PROJECT_API}/repository/branches" \
            "$(jq -n --arg branch "$BRANCH" --arg ref "$GITLAB_BRANCH" \
                 '{branch: $branch, ref: $ref}')"; then
            echo "::error::Could not create GitLab branch ${BRANCH} (needs a PAT with api scope and Developer role or higher)"
            exit 1
          fi

          if ! api PUT "${PROJECT_API}/repository/files/${FILE_PATH}" \
            "$(jq -n \
                 --arg branch "$BRANCH" \
                 --arg content "$(base64 -w 0 "$LESSONS")" \
                 --arg msg "docs-agent: update LESSONS.md after v${RELEASE_VERSION} run" \
                 '{branch: $branch, encoding: "base64", content: $content, commit_message: $msg}')"; then
            echo "::error::Could not commit LESSONS.md to ${BRANCH}"
            exit 1
          fi

          if ! api POST "${PROJECT_API}/merge_requests" \
            "$(jq -n \
                 --arg source "$BRANCH" \
                 --arg target "$GITLAB_BRANCH" \
                 --arg title "docs-agent: LESSONS.md update after v${RELEASE_VERSION} run" \
                 --arg desc "Automated LESSONS.md update from the docs agent run for v${RELEASE_VERSION}.

          Triggered by GitHub Actions run: ${RUN_URL}

          Please review the added lessons before merging." \
                 '{source_branch: $source,
                   target_branch: $target,
                   title: $title,
                   description: $desc,
                   remove_source_branch: true}')"; then
            echo "::error::Could not open the merge request (PAT needs api scope)"
            exit 1
          fi

          MR_URL=$(printf '%s' "$RESPONSE_BODY" | jq -r '.web_url // empty')
          echo "Merge request opened: ${MR_URL}"
          {
            echo "### LESSONS.md merge request"
            echo ""
            echo "Review and merge: ${MR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# Required secrets (set in the docs repo → Settings → Secrets and variables):
#
#   ANTHROPIC_API_KEY   — Anthropic API key (console.anthropic.com)
#   NOTION_API_TOKEN    — Notion integration token (notion.so/my-integrations)
#   GITLAB_PAT          — GitLab personal access token
#                           Scopes:  api  (required — creating a branch and a
#                                    merge request goes through the REST API;
#                                    read_repository + write_repository alone
#                                    is NOT enough and returns 403/404)
#                           Role:    Developer or higher (Guest/Reporter → 403)
#                           Tip:     use a project access token on ai-configs
#                                    (Settings → Access Tokens) to avoid user
#                                    membership issues
#   GITLAB_PROJECT      — URL-encoded GitLab namespace/project
#                           e.g. "newscatcher%2Fai-configs"
#
# GITHUB_TOKEN is provided automatically — no secret needed.
#
# Before first use:
#   1. Set GITLAB_PROJECT in the env block above (URL-encoded namespace/project)
#   2. Add the three secrets above
#   3. Run mirror-fastapi-oas.yml first to update fastapi-openapi.yml
#   4. Then trigger this workflow with the Notion URL, version, and date
# ─────────────────────────────────────────────────────────────────────────────
